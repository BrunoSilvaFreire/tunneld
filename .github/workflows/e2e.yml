name: Kubernetes E2E

on:
  pull_request:
    branches: [ master, 'feature/*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kubernetes:
    name: Kubernetes E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run Kubernetes e2e
        run: make e2e-k8s
        env:
          GONOSUMDB: github.com/BrunoSilvaFreire
          CLUSTER_NAME: tunneld-e2e
          IMAGE_TAG: e2e-${{ github.sha }}
          TUNNELD_IMAGE: ghcr.io/brunosilvafreire/tunneld-ci
          CONTROLLER_IMAGE: ghcr.io/brunosilvafreire/tunneld-ci-controller
          AGENT_IMAGE: ghcr.io/brunosilvafreire/tunneld-ci-agent

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-e2e-diagnostics
          path: e2e-artifacts
          if-no-files-found: ignore
