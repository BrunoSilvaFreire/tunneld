name: Build and Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zip
          make package-deb package-zip

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: tunneld-deb
          path: "*.deb"

      - name: Upload Zip Package
        uses: actions/upload-artifact@v4
        with:
          name: tunneld-zip
          path: "*.zip"
