name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  metadata:
    name: Prepare Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      owner_lc: ${{ steps.parse.outputs.owner_lc }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Parse Version and Metadata
        id: parse
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME=$(git describe --tags --abbrev=0 || echo "v0.0.0-dev")
          fi
          
          # Strip 'v' prefix for VERSION
          VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "owner_lc=$OWNER_LC" >> $GITHUB_OUTPUT

  build-artifacts:
    name: Build Artifacts (${{ matrix.arch }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zip
          make package-deb package-zip GOARCH=${{ matrix.arch }} VERSION=${{ needs.metadata.outputs.version }}
        env:
          GONOSUMDB: github.com/BrunoSilvaFreire

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.arch }}
          path: |
            *.deb
            *.zip

  build-docker:
    name: Build Docker Images (${{ matrix.arch }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tunneld
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Containerfile.tunneld
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld:${{ needs.metadata.outputs.tag }}-${{ matrix.arch }}
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld:latest-${{ matrix.arch }}

      - name: Build and push tunnelctl
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Containerfile.tunnelctl
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunnelctl:${{ needs.metadata.outputs.tag }}-${{ matrix.arch }}
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunnelctl:latest-${{ matrix.arch }}

      - name: Build and push tunneld-controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/Dockerfile.controller
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-controller:${{ needs.metadata.outputs.tag }}-${{ matrix.arch }}
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-controller:latest-${{ matrix.arch }}

      - name: Build and push tunneld-agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/Dockerfile.agent
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-agent:${{ needs.metadata.outputs.tag }}-${{ matrix.arch }}
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-agent:latest-${{ matrix.arch }}

  manifest:
    name: Create Multi-Arch Manifests
    needs: [metadata, build-docker]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push tunneld manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld:${{ needs.metadata.outputs.tag }} \
            -t ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld:latest \
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld:${{ needs.metadata.outputs.tag }}-amd64 \
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld:${{ needs.metadata.outputs.tag }}-arm64

      - name: Create and push tunnelctl manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunnelctl:${{ needs.metadata.outputs.tag }} \
            -t ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunnelctl:latest \
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunnelctl:${{ needs.metadata.outputs.tag }}-amd64 \
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunnelctl:${{ needs.metadata.outputs.tag }}-arm64

      - name: Create and push tunneld-controller manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-controller:${{ needs.metadata.outputs.tag }} \
            -t ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-controller:latest \
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-controller:${{ needs.metadata.outputs.tag }}-amd64 \
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-controller:${{ needs.metadata.outputs.tag }}-arm64

      - name: Create and push tunneld-agent manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-agent:${{ needs.metadata.outputs.tag }} \
            -t ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-agent:latest \
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-agent:${{ needs.metadata.outputs.tag }}-amd64 \
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-agent:${{ needs.metadata.outputs.tag }}-arm64

  build-helm:
    name: Package Helm Chart
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          mkdir -p chart-artifacts
          helm package k8s/charts/tunneld-operator \
            --version "${{ needs.metadata.outputs.version }}" \
            --app-version "${{ needs.metadata.outputs.version }}" \
            --destination chart-artifacts

      - name: Upload chart
        uses: actions/upload-artifact@v4
        with:
          name: release-chart
          path: chart-artifacts/*.tgz

  kubernetes-e2e:
    name: Kubernetes E2E
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run Kubernetes e2e
        run: make e2e-k8s
        env:
          GONOSUMDB: github.com/BrunoSilvaFreire
          CLUSTER_NAME: tunneld-release-e2e
          IMAGE_TAG: ${{ needs.metadata.outputs.tag }}
          TUNNELD_IMAGE: ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-ci
          CONTROLLER_IMAGE: ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-ci-controller
          AGENT_IMAGE: ghcr.io/${{ needs.metadata.outputs.owner_lc }}/tunneld-ci-agent

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-kubernetes-e2e-diagnostics
          path: e2e-artifacts
          if-no-files-found: ignore

  publish:
    name: Publish Release
    needs: [metadata, build-artifacts, build-helm, kubernetes-e2e, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
