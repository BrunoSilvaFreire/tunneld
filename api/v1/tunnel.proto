syntax = "proto3";

package tunnel.v1;

import "spec.proto";

option go_package = "tunneld/pkg/api/v1;tunnelv1";

service TunnelService {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc WatchStatus(WatchStatusRequest) returns (stream StatusResponse);
  rpc Start(StartRequest) returns (StartResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc Wait(WaitRequest) returns (WaitResponse);
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Logs(LogsRequest) returns (stream LogsResponse);
  rpc Enable(EnableRequest) returns (EnableResponse);
  rpc Disable(DisableRequest) returns (DisableResponse);
}

message TunnelStatus {
  string name = 1;
  string status = 2;
  TunnelSpec spec = 3;
  string error = 4;
  repeated ResolvedForward resolved_forwards = 5;
}

message LogsRequest {
  string name = 1;
  bool follow = 2;
}

message LogsResponse {
  string line = 1;
}

message StatusRequest {
  string name = 1; // Optional: if empty, return all
}

message StatusResponse {
  repeated TunnelStatus tunnels = 1;
}

message WatchStatusRequest {
  // Optional: stream only this tunnel. Empty means all tunnels.
  string name = 1;
  // Optional: server-side poll interval in milliseconds. 0 = server default (2000).
  // Bounded to [200, 60000] by the server.
  int32 interval_ms = 2;
}

message StartRequest {
  string name = 1;
}

message StartResponse {}

message StopRequest {
  string name = 1;
}

message StopResponse {}

message WaitRequest {
  string name = 1;
  int64 timeout_seconds = 2;
}

message WaitResponse {
  string status = 1;
  repeated ResolvedForward resolved_forwards = 2;
}

message CreateRequest {
  TunnelSpec spec = 1;
  map<string, bytes> inline_keys = 2;
  bool persistent = 3;
}

message CreateResponse {}

message UpdateRequest {
  TunnelSpec spec = 1;
  map<string, bytes> inline_keys = 2;
  bool persistent = 3;
}

message UpdateResponse {}

message DeleteRequest {
  string name = 1;
}

message DeleteResponse {}

message EnableRequest {
  string name = 1;
}

message EnableResponse {}

message DisableRequest {
  string name = 1;
}

message DisableResponse {}

service KeyService {
  rpc AddKey(AddKeyRequest) returns (AddKeyResponse);
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyResponse);
}

message AddKeyRequest {
  string name = 1;
  bytes content = 2;
}

message AddKeyResponse {}

message ListKeysRequest {}

message ListKeysResponse {
  repeated string names = 1;
}

message DeleteKeyRequest {
  string name = 1;
}

message DeleteKeyResponse {}
