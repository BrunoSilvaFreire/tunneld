---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: tunnels.tunneld.io
spec:
  group: tunneld.io
  names:
    kind: Tunnel
    listKind: TunnelList
    plural: tunnels
    shortNames:
    - tun
    singular: tunnel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.node
      name: Node
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Tunnel is a single SSH or kubectl port-forward tunnel managed
          by tunneld.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TunnelSpec mirrors api/v1/spec.proto:TunnelSpec, plus a K8s-only
              Expose section.
            properties:
              dependsOn:
                description: |-
                  DependsOn lists Tunnel names (same namespace) that must reach Healthy
                  before this one starts. Mirrors the daemon's DAG.
                items:
                  type: string
                type: array
              expose:
                description: ExposeSpec controls how the tunnel is published to the
                  cluster.
                properties:
                  forwardIndex:
                    description: |-
                      ForwardIndex selects which entry in localForwards/forwards to publish.
                      Defaults to 0.
                    format: int32
                    type: integer
                  service:
                    description: |-
                      Service: when true, the controller creates a ClusterIP Service + Endpoints
                      pointing at the scheduled node's IP and the resolved actualPort.
                    type: boolean
                  serviceName:
                    description: ServiceName overrides metadata.name as the Service
                      name.
                    type: string
                type: object
              health:
                description: HealthCheckSpec mirrors api/v1/spec.proto:HealthCheckSpec.
                properties:
                  address:
                    description: |-
                      Address overrides the auto-derived health check target.
                      Defaults to the first local forward.
                    type: string
                  interval:
                    type: string
                  startupTimeout:
                    type: string
                  timeout:
                    type: string
                  type:
                    default: tcp
                    enum:
                    - tcp
                    type: string
                type: object
              kubectl:
                description: KubectlSpec mirrors api/v1/spec.proto:KubectlSpec.
                properties:
                  apiServer:
                    type: string
                  context:
                    type: string
                  forwards:
                    items:
                      description: KubectlForward mirrors api/v1/spec.proto:KubectlForward.
                      properties:
                        localAddress:
                          default: 0.0.0.0
                          type: string
                        localPort:
                          format: int32
                          type: integer
                        remotePort:
                          format: int32
                          type: integer
                      required:
                      - localPort
                      - remotePort
                      type: object
                    type: array
                  insecureSkipTLSVerify:
                    type: boolean
                  kubeconfigRef:
                    description: LocalObjectRef references another resource by name
                      in the same namespace.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  kubeconfigSecretRef:
                    description: SecretKeyRef points at a single key within a Kubernetes
                      Secret in the same namespace.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  namespace:
                    type: string
                  resource:
                    type: string
                required:
                - forwards
                - resource
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector restricts which nodes the controller will
                  schedule this tunnel onto.
                type: object
              restart:
                description: RestartPolicySpec mirrors api/v1/spec.proto:RestartPolicySpec.
                properties:
                  backoff:
                    description: BackoffSpec mirrors api/v1/spec.proto:BackoffSpec.
                    properties:
                      maxDelay:
                        type: string
                      multiplierMilli:
                        default: 2000
                        description: |-
                          Multiplier in milli-units (e.g. 2000 = 2.0x). Kept as int to keep CRD
                          schemas portable; the agent divides by 1000 when calling the daemon.
                        format: int32
                        type: integer
                    type: object
                  delay:
                    type: string
                  maxAttempts:
                    format: int32
                    type: integer
                  policy:
                    default: on-failure
                    enum:
                    - always
                    - on-failure
                    - never
                    type: string
                type: object
              shutdownTimeout:
                type: string
              ssh:
                description: Exactly one of SSH or Kubectl must be set.
                properties:
                  host:
                    type: string
                  identityKeyRef:
                    description: IdentityKeyRef references a TunnelKey in the same
                      namespace. Preferred.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  identityKeySecretRef:
                    description: IdentityKeySecretRef references a raw Secret. Use
                      when you don't want a TunnelKey.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  localForwards:
                    items:
                      description: SSHForward mirrors api/v1/spec.proto:SSHForward.
                      properties:
                        listenAddress:
                          default: 0.0.0.0
                          type: string
                        listenPort:
                          description: 0 = dynamic port allocation. Resolved port
                            surfaces in status.
                          format: int32
                          type: integer
                        targetHost:
                          type: string
                        targetPort:
                          format: int32
                          type: integer
                      required:
                      - listenPort
                      - targetHost
                      - targetPort
                      type: object
                    type: array
                  options:
                    additionalProperties:
                      type: string
                    type: object
                  port:
                    default: 22
                    format: int32
                    type: integer
                  user:
                    type: string
                required:
                - host
                - localForwards
                - user
                type: object
              startupTimeout:
                type: string
            type: object
          status:
            description: TunnelStatus is the observed state of a Tunnel.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastError:
                type: string
              node:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: TunnelPhase is the high-level lifecycle state of a Tunnel.
                enum:
                - Pending
                - Healthy
                - Degraded
                - Failed
                - Stopped
                type: string
              resolvedForwards:
                items:
                  description: ResolvedForward mirrors api/v1/spec.proto:ResolvedForward.
                  properties:
                    actualPort:
                      format: int32
                      type: integer
                    configuredPort:
                      format: int32
                      type: integer
                    listenAddress:
                      type: string
                    remotePort:
                      format: int32
                      type: integer
                  required:
                  - actualPort
                  - configuredPort
                  - remotePort
                  type: object
                type: array
              serviceRef:
                description: LocalObjectRef references another resource by name in
                  the same namespace.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
