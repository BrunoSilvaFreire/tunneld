apiVersion: v1
kind: ServiceAccount
metadata:
  name: tunneld-controller
  namespace: tunneld-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tunneld-agent
  namespace: tunneld-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tunneld-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tunneld-controller
subjects:
  - kind: ServiceAccount
    name: tunneld-controller
    namespace: tunneld-system
  - kind: ServiceAccount
    name: tunneld-agent
    namespace: tunneld-system
# v1alpha1 binds both the central controller and the per-node agent to the same
# ClusterRole. The agent only needs a subset (get/list/watch + status updates on
# Tunnel/TunnelKey, get on Secret) but splitting the role isn't worth the moving
# parts until we add a webhook or finalizer that needs tighter scope.
