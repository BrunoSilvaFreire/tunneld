apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunneld-controller
  namespace: tunneld-system
  labels:
    app.kubernetes.io/name: tunneld-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tunneld-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tunneld-controller
    spec:
      serviceAccountName: tunneld-controller
      containers:
        - name: manager
          image: ghcr.io/brunosilvafreire/tunneld-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet: { path: /healthz, port: probes }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: probes }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: { drop: [ALL] }
