apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tunneld-agent
  namespace: {{ include "tunneld.namespace" . }}
  labels:
    {{- include "tunneld.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
    tunneld.io/mode: {{ .Values.mode }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: tunneld-agent
      {{- if eq .Values.mode "daemonset" }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if eq .Values.mode "host-installed" }}
      nodeSelector:
        tunneld.io/installed: "true"
        {{- with .Values.agent.extraNodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.agent.extraNodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- if eq .Values.mode "daemonset" }}
        - name: tunneld
          image: "{{ .Values.tunneld.image.repository }}:{{ .Values.tunneld.image.tag }}"
          imagePullPolicy: {{ .Values.tunneld.image.pullPolicy }}
          args:
            - run
            - --socket=/run/tunneld/tunneld.sock
            - --no-config
          volumeMounts:
            - { name: tunneld-socket, mountPath: /run/tunneld }
            - { name: tunneld-keys,   mountPath: /var/lib/tunneld/keys }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        {{- end }}
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            - --socket=/run/tunneld/tunneld.sock
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          volumeMounts:
            - { name: tunneld-socket, mountPath: /run/tunneld }
            {{- if eq .Values.mode "host-installed" }}
            - { name: tunneld-keys, mountPath: /var/lib/tunneld/keys }
            {{- end }}
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: probes,  containerPort: 8081 }
          livenessProbe:  { httpGet: { path: /healthz, port: probes }, initialDelaySeconds: 15, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /readyz,  port: probes }, initialDelaySeconds: 5,  periodSeconds: 10 }
          resources: {{ toYaml .Values.agent.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        {{- if eq .Values.mode "host-installed" }}
        - name: tunneld-socket
          hostPath: { path: {{ .Values.agent.hostSocketPath }}, type: Directory }
        - name: tunneld-keys
          hostPath: { path: {{ .Values.agent.hostKeyDir }}, type: DirectoryOrCreate }
        {{- else }}
        - name: tunneld-socket
          emptyDir: {}
        - name: tunneld-keys
          emptyDir: {}
        {{- end }}
